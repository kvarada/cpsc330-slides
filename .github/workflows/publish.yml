name: Publish slides

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Check saved Python outputs
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import re
          from pathlib import Path

          stale = []
          for source in sorted(Path("website").rglob("*.qmd")):
              if any(part.startswith(("_", ".")) for part in source.relative_to("website").parts):
                  continue
              if not re.search(r"^\s*`{3,}\{python\b", source.read_text(), re.MULTILINE):
                  continue
              frozen = Path("website/_freeze") / source.relative_to("website").with_suffix("") / "execute-results/html.json"
              try:
                  saved_hash = json.loads(frozen.read_text())["hash"]
              except (OSError, ValueError, KeyError):
                  saved_hash = None
              if saved_hash != hashlib.md5(source.read_bytes()).hexdigest():
                  stale.append(source)
                  print(f"::error file={source}::Missing or stale saved Python outputs. Render this slide locally, then commit its updated website/_freeze/ files and push again.")
          if stale:
              raise SystemExit(1)
          PY

      - name: Install Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: '1.10.18'

      # Commit website/_freeze along with locally rendered slide changes.
      # freeze: auto reuses those outputs without installing the ML environment.
      - name: Render website
        run: quarto render website

      - name: Restore PDF cache
        uses: actions/cache@v4
        with:
          path: .pdf-cache
          key: slide-pdfs-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            slide-pdfs-v1-${{ runner.os }}-

      - name: Plan PDF exports
        id: pdfs
        run: python3 scripts/slide_pdfs.py plan

      - name: Install Node.js
        if: steps.pdfs.outputs.missing != '0'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install DeckTape
        if: steps.pdfs.outputs.missing != '0'
        run: npm install --global decktape@3.16.1

      - name: Generate slide PDFs
        if: steps.pdfs.outputs.missing != '0'
        run: python3 scripts/slide_pdfs.py export

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: website/_site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
