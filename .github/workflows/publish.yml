name: Publish slides

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Check saved Python outputs
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import re
          from pathlib import Path

          stale = []
          for source in sorted(Path("website").rglob("*.qmd")):
              if any(part.startswith(("_", ".")) for part in source.relative_to("website").parts):
                  continue
              if not re.search(r"^\s*`{3,}\{python\b", source.read_text(), re.MULTILINE):
                  continue
              frozen = Path("website/_freeze") / source.relative_to("website").with_suffix("") / "execute-results/html.json"
              try:
                  saved_hash = json.loads(frozen.read_text())["hash"]
              except (OSError, ValueError, KeyError):
                  saved_hash = None
              if saved_hash != hashlib.md5(source.read_bytes()).hexdigest():
                  stale.append(source)
                  print(f"::error file={source}::Missing or stale saved Python outputs. Render this slide locally, then commit its updated website/_freeze/ files and push again.")
          if stale:
              raise SystemExit(1)
          PY

      - name: Install Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: '1.10.18'

      # Commit website/_freeze along with locally rendered slide changes.
      # freeze: auto reuses those outputs without installing the ML environment.
      - name: Render website
        run: quarto render website

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install DeckTape
        run: npm install --global decktape@3.16.1

      - name: Generate slide PDFs
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --bind 127.0.0.1 --directory website/_site > /tmp/slides-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          curl --fail --silent --retry 10 --retry-connrefused --retry-delay 1 http://127.0.0.1:8765/ > /dev/null

          shopt -s nullglob
          slides=(website/_site/slides/slides-*.html)
          if [ "${#slides[@]}" -eq 0 ]; then
            echo "::error::No rendered slides found for PDF export."
            exit 1
          fi
          for html in "${slides[@]}"; do
            echo "Exporting ${html%.html}.pdf"
            decktape reveal --chrome-arg=--no-sandbox --load-pause 2000 \
              "http://127.0.0.1:8765/slides/$(basename "$html")" "${html%.html}.pdf"
            test -s "${html%.html}.pdf"
          done

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: website/_site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
