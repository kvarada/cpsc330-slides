name: Publish slides

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Check saved Python outputs
        run: |
          if ! git ls-files website/_freeze | grep '/execute-results/' > /dev/null; then
            echo "::error::Saved Python outputs are missing. Render the slides locally, then commit and push website/_freeze/ before publishing."
            exit 1
          fi

      - name: Install Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: '1.10.18'

      # Commit website/_freeze along with locally rendered slide changes.
      # freeze: auto reuses those outputs without installing the ML environment.
      - name: Render website
        run: quarto render website

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: website/_site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
